<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just One Question 💖</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffd6e8,#fff);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.box{
  text-align:center;
  background:white;
  padding:40px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
  z-index:2;
}

h1{color:#ff4d88;margin-bottom:30px;}

button{
  padding:12px 30px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  margin:10px;
}

#yes{background:#ff4d88;color:white;}
#no{background:#ccc;position:absolute;}

#tease{
  position:fixed;
  bottom:20px;
  width:100%;
  text-align:center;
  font-size:16px;
  color:#ff4d88;
  font-weight:bold;
}

.heart,.flower{
  position:fixed;
  font-size:24px;
  animation:float 3s ease-out forwards;
}

@keyframes float{
  from{transform:translateY(0);opacity:1;}
  to{transform:translateY(-120vh);opacity:0;}
}
</style>
</head>

<body>

<div class="box" id="box">
  <h1>Will you be my girlfriend? 💕</h1>
  <button id="yes">Yes</button>
  <button id="no">No</button>
</div>

<div id="tease"></div>

<script>
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const box=document.getElementById("box");
const tease=document.getElementById("tease");

const messages=[
  "Come on… you know Yes is better 😉",
  "Still pressing No? Try Yes 😏",
  "Don’t be shy, hit Yes 💖",
  "Wrong choice… Yes is waiting 😌"
];

noBtn.addEventListener("click",()=>{
  const x=Math.random()*(window.innerWidth-100);
  const y=Math.random()*(window.innerHeight-50);
  noBtn.style.left=x+"px";
  noBtn.style.top=y+"px";

  tease.textContent=messages[Math.floor(Math.random()*messages.length)];
});

yesBtn.addEventListener("click",()=>{
  box.innerHTML="<h1>You’re lucky you chose me 🌹❤️</h1>";
  for(let i=0;i<40;i++) createLove();
});

function createLove(){
  const el=document.createElement("div");
  el.className=Math.random()>0.5?"heart":"flower";
  el.textContent=el.className==="heart"?"❤️":"🌹";
  el.style.left=Math.random()*100+"vw";
  el.style.bottom="0";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}
</script>

</body>
  </html>
