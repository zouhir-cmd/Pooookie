<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just One Question 💖</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
html,body{height:100%;overflow:hidden;transition:background 1s ease;}

/* ==================== Body ==================== */
body {
  background: linear-gradient(135deg,#ffd6e8,#fff);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

/* ==================== Splash Screen ==================== */
#splash {
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  width:100vw;
  position:absolute;
  top:0; left:0;
  z-index:10;
}

#splash h1{
  font-size:6rem;
  color:#ff4d88;
  text-shadow:0 0 20px rgba(255,77,136,0.5);
  margin-bottom:50px;
}

#splash .arrow {
  width:80px;
  height:80px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(12px);
  border:2px solid rgba(255,255,255,0.3);
  box-shadow:0 0 35px rgba(255,255,255,0.3);
  transition: all 0.3s ease;
}

#splash .arrow:hover{
  transform: scale(1.15);
  box-shadow:0 0 55px rgba(255,77,136,0.6);
}

#splash .arrow::after{
  content:'↓';
  font-size:2rem;
  color:#fff;
}

/* ==================== Question Box ==================== */
#box{
  display:none; 
  text-align:center;
  padding:50px;
  border-radius:25px;
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.1);
  border:2px solid rgba(255,255,255,0.3);
  box-shadow: 0 12px 40px rgba(0,0,0,0.1);
  animation:fadeIn 1s ease forwards;
}

#box h1{
  font-size:2.5rem;
  background: linear-gradient(135deg, #ff9a9e,#fad0c4,#ff9a9e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation:gradientMove 5s ease infinite;
  padding:15px 25px;
  border-radius:20px;
  backdrop-filter: blur(10px);
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

button{
  padding:15px 45px;
  font-size:1.3rem;
  border:none;
  border-radius:35px;
  cursor:pointer;
  margin:15px;
  backdrop-filter: blur(10px);
  transition:0.3s;
}

#yes{background:rgba(255,77,136,0.8); color:white;}
#yes:hover{transform:scale(1.1);}
#no{background:rgba(200,200,200,0.5); position:absolute;}
#no:hover{transform:scale(1.1);}

/* ==================== Tease Text ==================== */
#tease{
  position:fixed;
  bottom:25px;
  width:100%;
  text-align:center;
  font-size:18px;
  color:#ff4d88;
  font-weight:bold;
  z-index:3;
}

/* ==================== Final Heart ==================== */
#finalHeart{
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform: translate(-50%,-50%);
  font-size:180px;
  color:#ff4d88;
  background: rgba(255,255,255,0.15);
  border-radius:50%;
  padding:90px;
  backdrop-filter: blur(25px);
  border:2px solid rgba(255,255,255,0.3);
  box-shadow: 0 0 90px rgba(255,77,136,0.6);
  text-align:center;
  line-height:1.2;
}

/* ==================== Animations ==================== */
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
</style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <h1>Hi</h1>
  <div class="arrow"></div>
</div>

<!-- Question Box -->
<div id="box">
  <h1>Will you be my girlfriend? 💕</h1>
  <button id="yes">Yes</button>
  <button id="no">No</button>
</div>

<!-- Tease text -->
<div id="tease"></div>

<!-- Final Heart -->
<div id="finalHeart">You’re lucky you chose me 🌹❤️</div>

<script>
// ===== Splash Screen =====
const splash = document.getElementById('splash');
const arrow = document.querySelector('.arrow');
const box = document.getElementById('box');

arrow.addEventListener('click',()=>{
  splash.style.display='none';
  box.style.display='block';
});

// ===== No Button =====
const noBtn=document.getElementById('no');
const tease=document.getElementById('tease');
const messages=[
  "Come on… you know Yes is better 😉",
  "Still pressing No? Try Yes 😏",
  "Don’t be shy, hit Yes 💖",
  "Wrong choice… Yes is waiting 😌"
];

noBtn.addEventListener("click",()=>{
  const x=Math.random()*(window.innerWidth-150);
  const y=Math.random()*(window.innerHeight-80);
  noBtn.style.left=x+"px";
  noBtn.style.top=y+"px";
  tease.textContent=messages[Math.floor(Math.random()*messages.length)];
});

// ===== Yes Button =====
const yesBtn=document.getElementById('yes');
const finalHeart=document.getElementById('finalHeart');

yesBtn.addEventListener("click",()=>{
  box.style.display='none';
  finalHeart.style.display='block';
  document.body.style.background='black';
});
</script>
</body>
  </html>
